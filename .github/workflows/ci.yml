name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: matrix
        name: Validate and list the Minecraft versions
        run: echo "versions=$(python3 -I scripts/release/matrix.py --github-matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Minecraft ${{ matrix.minecraft }}
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Every lane picks its own toolchain (17, 21 or 25) from the release matrix; the last one
      # listed runs Gradle.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle
      - name: Build the jars
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: >
          ./gradlew "-PmpsTarget=$MINECRAFT" buildTarget --console=plain
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Start a dedicated server with each jar
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: >
          python3 -I scripts/e2e/server_smoke.py --minecraft "$MINECRAFT"
          --java "17=$JAVA_HOME_17_X64" --java "21=$JAVA_HOME_21_X64" --java "25=$JAVA_HOME_25_X64"
      - name: Upload the server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs-${{ matrix.minecraft }}
          path: build/server-smoke/logs/
          if-no-files-found: ignore
      - name: Upload the jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars-${{ matrix.minecraft }}
          path: "*/versions/${{ matrix.minecraft }}/build/libs/MultiplayerSpawners-*-${{ matrix.minecraft }}-*[0-9].jar"
          if-no-files-found: error

  # One fixed name for the ruleset to require, whatever versions the matrix lists.
  all-versions:
    name: All Minecraft versions
    needs: [matrix, build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every version built and passed its server smoke test
        env:
          MATRIX: ${{ needs.matrix.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "matrix: $MATRIX, build: $BUILD"
          [[ "$MATRIX" == success && "$BUILD" == success ]]
