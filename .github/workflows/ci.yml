name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: matrix
        name: Validate and list the Minecraft versions
        run: echo "versions=$(python3 -I scripts/release/matrix.py --github-matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Minecraft ${{ matrix.minecraft }}
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Every lane picks its own toolchain (17, 21 or 25) from the release matrix; the last one
      # listed runs Gradle.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle
      - name: Build the jars
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: >
          ./gradlew "-PmpsTarget=$MINECRAFT" buildTarget --console=plain
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Start a dedicated server with each jar
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: >
          python3 -I scripts/e2e/server_smoke.py --minecraft "$MINECRAFT"
          --java "17=$JAVA_HOME_17_X64" --java "21=$JAVA_HOME_21_X64" --java "25=$JAVA_HOME_25_X64"
      - name: Upload the server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs-${{ matrix.minecraft }}
          path: build/server-smoke/logs/
          if-no-files-found: ignore
      # Three clients and a server need the runner's memory more than an idle Gradle daemon.
      - name: Stop the Gradle daemon
        run: ./gradlew --stop
      - name: Install the virtual display and input tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xdotool libgl1-mesa-dri libglx-mesa0 \
            libegl1 libegl-mesa0
      - name: Install the hash-locked test packages
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r e2e/requirements.txt
      - name: Play each jar with three real clients on a dedicated server
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: >
          python3 -I scripts/e2e/multiplayer.py --minecraft "$MINECRAFT"
          --java "17=$JAVA_HOME_17_X64" --java "21=$JAVA_HOME_21_X64" --java "25=$JAVA_HOME_25_X64"
      - name: Upload what the players saw
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multiplayer-${{ matrix.minecraft }}
          path: |
            build/multiplayer/lanes/*/screenshots/
            build/multiplayer/lanes/*/*.log
            build/multiplayer/lanes/*/*-threads.txt
            build/multiplayer/lanes/*/result.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload the captures for the project site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.minecraft }}
          path: build/multiplayer/evidence/
          retention-days: 1
          if-no-files-found: error
      - name: Upload the jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars-${{ matrix.minecraft }}
          path: "*/versions/${{ matrix.minecraft }}/build/libs/MultiplayerSpawners-*-${{ matrix.minecraft }}-*[0-9].jar"
          if-no-files-found: error

  # On main, every version's captures go to the pinned mod-base kit, which publishes them on the
  # project site (pages.yml). The job and step names are the ones site/mod-base.json names.
  evidence:
    name: Prepare public evidence for mc${{ matrix.minecraft }}
    needs: [matrix, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify the pinned kit and install the imaging dependency
        uses: The-Plum-Team/mod-base/actions/setup@acb01ca4f625a5d27f1c1a709a416d9725bef64f # v1.7.0
      - name: Download the captures of this version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-${{ matrix.minecraft }}
          path: ${{ runner.temp }}/evidence
      - name: Read the subject tree
        id: subject
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Prepare and hand off public evidence
        uses: The-Plum-Team/mod-base/actions/prepare-evidence@acb01ca4f625a5d27f1c1a709a416d9725bef64f # v1.7.0
        with:
          e2e-root: ${{ runner.temp }}/evidence
          key: mc${{ matrix.minecraft }}
          subject-branch: ${{ github.ref_name }}
          subject-commit: ${{ github.sha }}
          subject-tree: ${{ steps.subject.outputs.tree }}
          tested-run-id: ${{ github.run_id }}
          tested-run-attempt: ${{ github.run_attempt }}
          tested-branch: ${{ github.ref_name }}
          tested-commit: ${{ github.sha }}
          tested-controller-branch: ${{ github.ref_name }}
          tested-controller-sha: ${{ github.sha }}

  notify-pages:
    name: Wake the project site
    needs: evidence
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the separately locked Pages publication
        uses: The-Plum-Team/mod-base/actions/notify-pages@acb01ca4f625a5d27f1c1a709a416d9725bef64f # v1.7.0
        with:
          operation: deploy
          run-id: ${{ github.run_id }}
          sha: ${{ github.sha }}

  # One fixed name for the ruleset to require, whatever versions the matrix lists.
  all-versions:
    name: All Minecraft versions
    needs: [matrix, build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every version built and passed its server and multiplayer tests
        env:
          MATRIX: ${{ needs.matrix.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "matrix: $MATRIX, build: $BUILD"
          [[ "$MATRIX" == success && "$BUILD" == success ]]
