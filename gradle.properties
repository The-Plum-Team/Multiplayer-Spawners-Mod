org.gradle.jvmargs=-Xmx3G
# Architectury 3.5.170 hands transformer classpaths over through JVM-global system properties, so
# its transformProduction* tasks must not run in parallel.
org.gradle.parallel=false
org.gradle.caching=false

# Everything about versions (mod version, Minecraft versions, loaders, Java, dependency versions)
# lives in release/release-matrix.json. -PmpsTarget=<minecraft> picks the version to build.
