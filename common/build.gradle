plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = "1.21.1-20240808.144430"
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = [file("src/main/resources/META-INF/accesstransformer.cfg")]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

// ADD: Repository for Forge Config API Port
repositories {
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

    // Forge Config API Port for common module - 1.21.1 (NeoForge API)
    api "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:21.1.6"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}